# OCR / playlist names → catalog names used in commercial reports.
# Matching is case-insensitive and ignores punctuation/spaces.

catalog:
  CAMARA DE COMERCIO:
    - CAMERO
    - GAMERO
    - CAMARA DE COMERCIO
    - CAMARA COMERCIO
  NETPLUS:
    - NETT PLUS
    - NETTPLUS
    - NET PLUS
    - NETPLUS
    - NETT.PLUS
    - NETT.plus
    - NETTplus
    - NETTPIUS
    - NETTOIUS
    - NETTOLUS
  HOTEL VICTORIA:
    - GRAND VICTORIA
    - HOTEL VICTORIA
    - HOTEL GRAND VICTORIA
  CABLE RED:
    - COBLERED
    - CABLE RED
    - CABLED
    - CABLEDRED
  ECUABET:
    - ECUABET
    - ECUA BET
    - ECUABET COM
    - ECUEBET
    - Ecuabet
  SIETE.COM:
    - SIETE.COM
    - SIETE
    - Siete.com
    - SIETECOM
  GRAND AVIATION:
    - GRAND AVIATION
    - GRANDAVIATION
    - GRAND-AVIATION
  1XBET:
    - 1XBET
    - 1xbet
    - 1 X BET
  LIONS SPORTS AND MEDIA:
    - LIONS SPORTS AND MEDIA
    - LIONS SPORT AND MEDIA
    - LIONS SPORTS MEDIA
    - LIONS
  PILSENER:
    - PILSENER
    - PILSEN
  TISANITA:
    - TISANITA
  UTPL:
    - UTPL
    - UTPL POSGRADO

# Broadcast graphics — never counted as stadium inventory.
overlay_ignore:
  - ZAPPING
  - XTRIM
  - SHOWTIME
  - VIVO
  - WWW
  - HTTP
  - HTTPS
  - LIGAECUABET
  - LIGA ECUABET
  - SCOREBUG
