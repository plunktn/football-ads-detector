# Liga Ecuabét — values match hardcoded constants in roi.py and scoreboard.py.
id: ligaecuabet
nombre: Liga Ecuabét
pais: Ecuador
default_camera: default

camera:
  id: default
  variante: default
  scoreboard_crop:
    x: 0.0
    y: 0.0
    w: 0.42
    h: 0.22
  grass_hsv:
    lower: [28, 25, 30]
    upper: [85, 255, 255]
  led_band:
    top_frac: 0.12
    height_frac: 0.035
    min_height_px: 22
    max_height_px: 70
  grass_y_top_frac: 0.28
  grass_y_bot_frac: 0.92
  grass_min_ratio: 0.08
  matte_yellow:
    hsv:
      lower: [18, 70, 70]
      upper: [40, 255, 255]
    col_frac: 0.55
    keep_col_frac: 0.22
    texture_max: 14.0
    min_led_mean_v: 70.0
  panel_zones:
    - id: led_lateral_main
      posicion: LATERAL_MAIN
      tipo_panel: LED_DYNAMIC
      prioridad: 1
    - id: fixed_second_row
      posicion: FIXED_BOARD_MIDFIELD
      tipo_panel: FIXED_PRINT
      prioridad: 2
